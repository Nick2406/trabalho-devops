name: Pipeline de Integração Contínua (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências do Backend
      run: |
        cd backend
        npm install

    - name: Executar Testes Automatizados (Jest)
      run: |
        cd backend
        npm test

    - name: Validar Build das Imagens Docker
      run: |
        docker compose build