services:
  # 1. Serviço do Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: hardware_db
    restart: always # Cumpre o requisito "Possuir restart policy"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-senha_secreta} # Variáveis de ambiente
      POSTGRES_DB: pedidos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # Resolve "Problema 4": Volumes persistentes
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql # Roda seu script inicial
    networks:
      - internal_network # Utilizar rede interna Docker
    healthcheck: # Resolve "Problema 3": Healthcheck no banco
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Serviço do Backend Node.js
  backend:
    build: ./backend
    container_name: hardware_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-senha_secreta}
      DB_NAME: pedidos_db
    networks:
      - internal_network
    depends_on:
      db:
        condition: service_healthy # Resolve "Problema 3": Só inicia após o banco estar saudável

  # 3. Serviço do Frontend React
  frontend:
    build: ./frontend
    container_name: hardware_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000 # Variável de ambiente
    networks:
      - internal_network
    depends_on:
      - backend # Frontend aguarda o backend

# Define a rede interna exigida
networks:
  internal_network:
    driver: bridge

# Define os volumes para persistência exigida
volumes:
  pgdata: